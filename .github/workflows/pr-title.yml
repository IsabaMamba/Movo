name: PR title

# Squash-merge uses the PR title as the commit subject, so the title is what
# actually lands in history. Checking it here keeps main readable without
# imposing a local commit hook on every save.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,80}$'
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title does not follow Conventional Commits."
            echo "Got:      $TITLE"
            echo "Expected: type(scope): short description"
            echo "Types:    feat fix docs style refactor perf test build ci chore revert"
            echo "Examples: feat(discover): show sessions before signup"
            echo "          fix(participation): promote waitlist head on cancel"
            exit 1
          fi
          echo "OK: $TITLE"
